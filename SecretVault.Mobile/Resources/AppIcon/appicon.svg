<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Icon background: the desktop app's diagonal blue gradient (accent -> nav rail navy). Android applies its own mask shape. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4294FF"/>
      <stop offset="1" stop-color="#1F4788"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="456" height="456" fill="url(#bg)"/>
</svg>
